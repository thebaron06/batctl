# Battery charge limiting rules
# Format: <soc_threshold_%> <scale_factor>
# Rules are evaluated highest-threshold-first; first match wins.
# If SoC >= threshold, max charge is set to: scale_factor * 100 * SF (SF ... ScaleFactor)
# A scale of 1.0 means no reduction; 0.0 means no charging.

# At 95% SoC only allow 5% of max charge rate
95  0.05

# At 90% SoC allow 15% of max charge rate
90  0.10

# At 80% SoC allow 50% of max charge rate
80  0.30

